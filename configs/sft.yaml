# SFT checkpoints (lr 5e-5 run), steps 1k-10k.
extends: base.yaml
stage: sft
lr: "5e-5"
model: allenai/Olmo-3-32B-Think-SFT
revision: "5e-5-step{step}"
key: "sft_5e-5_step{step:05d}"
steps: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000]
sampling:
  max_new_tokens: {default: 8192, fortress: 8192}
note: "SFT checkpoint under the pinned eval template"
