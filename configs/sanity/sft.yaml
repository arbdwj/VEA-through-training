# Sanity check: one sft checkpoint through generate -> judge -> analyze; must land near the existing data.
stage: sft
lr: "5e-5"
model: allenai/Olmo-3-32B-Think-SFT
revision: "5e-5-step{step}"
key: "sanity_sft_step{step}"
steps: [10000]
template:                         # replaces the checkpoint branch's own template; rendered prompt asserted
  name: eval
  repo: allenai/Olmo-3-32B-Think-DPO
  rev: "97604023f2602a7dfe6d31b1fc229985e0002022"
  system: You are a helpful AI assistant.
  think: true                     # prompt ends with <think>
  newline: false                  # append '\n' after the template (asserted: changes only the last token)
dataset:                          # 444 prompts: 4 benchmarks + Fortress (ids prefixed fortress_)
  bench: data/prompts/bench_prompts.jsonl
  fortress: data/prompts/fortress_prompts.jsonl
sampling: standard                # default configs/sampling/<name>.yaml (override with --sampling)
require_close_think: false        # judge only rollouts that close </think>
note: "sanity check: re-run of sft_5e-5_step10000 through the current pipeline; compare with data/sft/vea.jsonl"
